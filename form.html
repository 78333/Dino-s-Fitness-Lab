      <h1>Membership Application Form</h1>
      <h2>Fill in the following registration to become a member at Dino's fitness lab</h2>
      <div class="form-container">
    <form class="registration-form">
      <label for="name">First Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your first name"
        required
      />

      <label for="surname">Surname</label>
      <input
        type="text"
        id="surname"
        name="surname"
        placeholder="Enter your surname"
        required
      />

      <label for="idnumber">ID Number</label>
      <input
        type="text"
        id="idnumber"
        name="idnumber"
        placeholder="Enter your ID number"
        required
      />

      <label for="phone">Cell Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your cell phone number"
        required
      />

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      />

      <label for="address">Residential Address</label>
      <textarea
        id="address"
        name="address"
        rows="3"
        placeholder="Enter your home address"
        required
      ></textarea>

      <label for="plan">Membership Plan</label>
      <select id="plan" name="plan" required>
        <option value="">Select a Membership Plan</option>
        <option>Basic Membership</option>
        <option>Premium Membership</option>
        <option>Elite Membership</option>
      </select>
      <label for="bank">Bank Name</label>
      <input
        type="text"
        id="bank"
        name="bank"
        placeholder="Enter your bank name"
        required
      />

      <label for="account">Bank Account Number</label>
      <input
        type="text"
        id="account"
        name="account"
        placeholder="Enter your account number"
        required
      />

      <label for="goals">Fitness Goals</label>
      <textarea
        id="goals"
        name="goals"
        rows="4"
        placeholder="Tell us about your fitness goals"
      ></textarea>

      <label for="emergency-name">Emergency Contact Name</label>
      <input
        type="text"
        id="emergency-name"
        name="emergency-name"
        placeholder="Enter emergency contact name"
        required
      />

      <label for="emergency-phone">Emergency Contact Number</label>
      <input
        type="tel"
        id="emergency-phone"
        name="emergency-phone"
        placeholder="Enter emergency contact number"
        required
      />

      <button type="submit">Complete Registration</button>
    </form>
    </div>
